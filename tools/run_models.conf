# =============================================================================
# loop-framework: per-role model configuration (sourced by run_task.sh)
# =============================================================================
# Edit this file anytime; it takes effect from the NEXT session launch
# (mid-task edits affect the review phase, between-task edits the next task).
# Precedence: RUN_MODEL env (one-shot override) > this file > built-in default.
#
# Format: IMPLEMENTER_MODEL=provider/model-id and REVIEWER_MODEL=provider/model-id
# (see `opencode models` for valid ids)
# Optional: MODEL_VARIANT=<reasoning effort> — passed as `opencode run --variant`
# (e.g. low|high|max for ox-alpha free; empty/unset = provider default).

IMPLEMENTER_MODEL=opencode/x-preview-f-free
REVIEWER_MODEL=opencode/x-preview-f-free
MODEL_VARIANT=max
